<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 478" width="1520" height="956" font-family="Helvetica, Arial, sans-serif">
<title>Each SIU message passes eight steps and ends in one ACK</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#B5B3AA"/></marker></defs>
<rect width="760" height="478" fill="#FFFFFF"/>
<text x="24" y="40" font-size="15" font-weight="600" fill="#1F1E1C" text-anchor="start">Each SIU message passes eight steps and ends in one ACK</text>
<rect x="24" y="92" width="160" height="72" rx="8" fill="none" stroke="#B5B3AA" stroke-width="1.25"/>
<text x="104" y="116" font-size="13" font-weight="600" fill="#1F1E1C" text-anchor="middle">Scheduling system</text>
<text x="104" y="132" font-size="11.5" font-weight="400" fill="#5F5E58" text-anchor="middle">(PAS or engine)</text>
<text x="104" y="148" font-size="11.5" font-weight="400" fill="#5F5E58" text-anchor="middle">sends S12 to S15</text>
<rect x="216" y="72" width="304" height="382" rx="8" fill="none" stroke="#2F6FD6" stroke-width="2"/>
<text x="368" y="96" font-size="13" font-weight="600" fill="#1F1E1C" text-anchor="middle">Your adapter (any language)</text>
<rect x="232" y="112" width="272" height="32" rx="8" fill="none" stroke="#B5B3AA" stroke-width="1.25"/>
<text x="368" y="132" font-size="13" font-weight="400" fill="#1F1E1C" text-anchor="middle">F1 Receive: MLLP frame, port 2575</text>
<rect x="232" y="154" width="272" height="32" rx="8" fill="none" stroke="#B5B3AA" stroke-width="1.25"/>
<text x="368" y="174" font-size="13" font-weight="400" fill="#1F1E1C" text-anchor="middle">F2 Parse: delimiters from MSH</text>
<rect x="232" y="196" width="272" height="32" rx="8" fill="none" stroke="#B5B3AA" stroke-width="1.25"/>
<text x="368" y="216" font-size="13" font-weight="400" fill="#1F1E1C" text-anchor="middle">F3 Validate: SIU S12 to S15 only</text>
<rect x="232" y="238" width="272" height="32" rx="8" fill="none" stroke="#B5B3AA" stroke-width="1.25"/>
<text x="368" y="258" font-size="13" font-weight="400" fill="#1F1E1C" text-anchor="middle">F4 Map: sections 6 and 7</text>
<rect x="232" y="280" width="272" height="32" rx="8" fill="none" stroke="#B5B3AA" stroke-width="1.25"/>
<text x="368" y="300" font-size="13" font-weight="400" fill="#1F1E1C" text-anchor="middle">F5 Resolve Organization by AIL-3.4</text>
<rect x="232" y="322" width="272" height="32" rx="8" fill="none" stroke="#B5B3AA" stroke-width="1.25"/>
<text x="368" y="342" font-size="13" font-weight="400" fill="#1F1E1C" text-anchor="middle">F6 Order check against MSH-7</text>
<rect x="232" y="364" width="272" height="32" rx="8" fill="none" stroke="#B5B3AA" stroke-width="1.25"/>
<text x="368" y="384" font-size="13" font-weight="400" fill="#1F1E1C" text-anchor="middle">F7 Write: conditional updates</text>
<rect x="232" y="406" width="272" height="32" rx="8" fill="none" stroke="#B5B3AA" stroke-width="1.25"/>
<text x="368" y="426" font-size="13" font-weight="400" fill="#1F1E1C" text-anchor="middle">F8 Acknowledge: AA, AE or AR</text>
<rect x="544" y="72" width="192" height="382" rx="8" fill="none" stroke="#B5B3AA" stroke-width="1.25"/>
<text x="640" y="96" font-size="13" font-weight="600" fill="#1F1E1C" text-anchor="middle">FHIR R4 server</text>
<text x="640" y="128" font-size="11.5" font-weight="400" fill="#5F5E58" text-anchor="middle">Track loads the</text>
<text x="640" y="144" font-size="11.5" font-weight="400" fill="#5F5E58" text-anchor="middle">Organizations first</text>
<rect x="560" y="258" width="160" height="56" rx="8" fill="#EEEDE8" stroke="#B5B3AA" stroke-width="1.25"/>
<text x="640" y="282" font-size="13" font-weight="600" fill="#1F1E1C" text-anchor="middle">Organizations</text>
<text x="640" y="298" font-size="11.5" font-weight="400" fill="#5F5E58" text-anchor="middle">read only (A3)</text>
<rect x="560" y="330" width="160" height="92" rx="8" fill="none" stroke="#B5B3AA" stroke-width="1.25"/>
<text x="640" y="354" font-size="13" font-weight="600" fill="#1F1E1C" text-anchor="middle">Adapter writes</text>
<text x="640" y="370" font-size="11.5" font-weight="400" fill="#5F5E58" text-anchor="middle">Patient, Practitioner</text>
<text x="640" y="386" font-size="11.5" font-weight="400" fill="#5F5E58" text-anchor="middle">Location, Appointment</text>
<text x="640" y="402" font-size="11.5" font-weight="400" fill="#5F5E58" text-anchor="middle">AU Core profiles</text>
<g fill="none" stroke="#B5B3AA" stroke-width="1.25">
<path d="M184 128H232" marker-end="url(#a)"/>
<path d="M368 144V154" marker-end="url(#a)"/>
<path d="M368 186V196" marker-end="url(#a)"/>
<path d="M368 228V238" marker-end="url(#a)"/>
<path d="M368 270V280" marker-end="url(#a)"/>
<path d="M368 312V322" marker-end="url(#a)"/>
<path d="M368 354V364" marker-end="url(#a)"/>
<path d="M368 396V406" marker-end="url(#a)"/>
<path d="M640 152V258" marker-end="url(#a)"/>
<path d="M504 296H560" marker-end="url(#a)"/>
<path d="M504 338H560" marker-end="url(#a)"/>
<path d="M504 380H560" marker-end="url(#a)"/>
<path d="M232 422H104V164" marker-end="url(#a)"/>
</g>
<text x="200" y="120" font-size="11.5" font-weight="400" fill="#5F5E58" text-anchor="middle">SIU</text>
<text x="532" y="290" font-size="10" font-weight="400" fill="#5F5E58" text-anchor="middle">GET</text>
<text x="532" y="332" font-size="10" font-weight="400" fill="#5F5E58" text-anchor="middle">GET</text>
<text x="532" y="374" font-size="10" font-weight="400" fill="#5F5E58" text-anchor="middle">PUT</text>
<text x="112" y="300" font-size="11.5" font-weight="400" fill="#5F5E58" text-anchor="start">ACK</text>
</svg>